<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<title>QRCode Generator</title>
	<link rel="shortcut icon" href="favicon.png" type="image/png" />
	<script src="qrcode.min.js"></script>

	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			font-family: Arial, sans-serif;
			font-size: 12px;
			background: #ffe;
			text-align: center;
		}

		#box {
			position: relative;
			overflow: hidden;
			height: 300px;
			padding: 3em;
			background: url("data:image/gif;base64,R0lGODlhBgAGAIAAAO7u7t7e3iH5BAAAAAAALAAAAAAGAAYAAAIKhIOXgKGuDIOzAAA7") #eeeff1;
		}

		#box svg {
			position: absolute;
			right: 50%;
			bottom: 50%;
			transform: translate(50%, 50%);
			display: block;
			cursor: pointer;
			max-width: 100%;
			max-height: 100%;
		}

		.download-buttons {
			margin: 1em 0;
		}

		.download-buttons button {
			background: #0ae;
			color: #fff;
			border: none;
			padding: 0.7em 1.2em;
			cursor: pointer;
			font-size: 13px;
			border-radius: 4px;
			margin: 0 0.3em;
			transition: background 0.2s ease;
		}

		.download-buttons button:hover {
			background: #09c;
		}

		input[type="number"], input[type="color"] { width: 5em; }
		input[type="number"] { padding: 0.25em; text-align: right; }

		select {
			width: 9em;
			font-size: 11px;
			padding: 0.25em 0.2em;
		}

		option { padding: 0.25em 0.2em; }

		textarea {
			resize: none;
			padding: 2.5em;
			color: #358;
			background: #eef2f4;
			font-size: 2em;
			border: 0;
			width: 100%;
			text-align: center;
		}

		#set { background: #fff; user-select: none; overflow: hidden; }
		#set table { border-collapse: collapse; margin: 2em auto; font-size: 11px; text-transform: uppercase; }
		#set th, #set td { padding: 0.4em 0.5em; }
		#set th { text-align: right; color: #567; }
		#set td { text-align: left; }

		.opt { display: block; padding: 1em; color: #fff; text-decoration: none; }
		#op1.opt { background: #0ae; }
		#op1.opt:hover { background: #0af; }
		#op2.opt { background: #ea0; }
		#op2.opt:hover { background: #fa0; }

		#set table, #set .legend, #set #op2.opt, #set.show #op1.opt { display: none; }
		#set.show table { display: table; }
		#set.show #op2.opt { display: block; }

		.legend { padding: 1.5em 0.5em; border-bottom: 1px #eee solid; }

		#res {
			color: #789; padding: 2em; text-align: left;
			font-family: "Lucida Console", Monaco, monospace;
		}

		#res b { font-weight: normal; }
		#res .obj { color: #789; }
		#res .obj b { color: #345; font-weight: bold; }
		#res .key { color: #45a; }
		#res .num { color: #12a; }
		#res .txt { color: #9ab; }
		#res .txt i { color: #384; }
		#res .clr { color: #9ab; }
		#res .clr i { color: #731; }
		#res a { color: #67a; }
		#res a:hover { color: #67e; }

		@media (min-width: 620px) {
			html, body, #box, #set, #txt, #msg, #hnt {
				position: absolute; top: 0; right: 0; left: 0; bottom: 0; display: block;
			}
			html, body { overflow: hidden; }
			#box { height: auto; }
			#txt, #hnt { height: 250px; top: auto; border-top: 3px #eee solid; }
			#set, #hnt { width: 270px; left: auto; }
			#box, #txt { right: 270px; }
			#set, #box { bottom: 250px; }
			#set { overflow-y: auto; }
			#set .legend, #set table { display: block; }
			#set .opt { display: none !important; }
		}

		@media (min-width: 900px) {
			#set, #hnt { width: 30%; }
			#box, #txt { right: 30%; }
		}

		@media (min-width: 1600px) {
			#set, #hnt { width: 480px; }
			#box, #txt { right: 480px; }
		}
	</style>
</head>

<body>
	<div id="box"></div>


	<div id="set">
		<a id="op1" class="opt" href="#">Show settings</a>
		<a id="op2" class="opt" href="#">Hide settings</a>

		<div class="legend"><h3>QRCODE SETTINGS</h3></div>

		<table>
			<tr><th><label for="in1">Dimension</label></th><td><input id="in1" type="number" value="256" min="256" max="61440" step="64" /></td></tr>
			<tr><th><label for="in2">Padding</label></th><td><input id="in2" type="number" value="4" min="0" max="10" /></td></tr>
			<tr><th><label for="in3">Pattern</label></th>
				<td>
					<select id="in3">
						<option value="-1" selected>(AUTO)</option>
						<option value="0">TYPE 0</option><option value="1">TYPE 1</option>
						<option value="2">TYPE 2</option><option value="3">TYPE 3</option>
						<option value="4">TYPE 4</option><option value="5">TYPE 5</option>
						<option value="6">TYPE 6</option><option value="7">TYPE 7</option>
					</select>
				</td>
			</tr>
			<tr><th><label for="in4">ECL</label></th>
				<td>
					<select id="in4" size="4">
						<option value="L">LOW</option>
						<option value="M" selected>MEDIUM</option>
						<option value="Q">QUARTILE</option>
						<option value="H">HIGH</option>
					</select>
				</td>
			</tr>
			<tr><th><label for="in5">Boost ECL</label></th><td><input id="in5" type="checkbox" checked /></td></tr>
			<tr><th><label for="in6">Faces</label></th><td><input id="in6" type="color" value="#000000" /></td></tr>
			<tr><th><label for="in7">Background color</label></th><td><input id="in7" type="color" value="#f2f4f8" /></td></tr>
			<tr><th><label for="in8">Background opaque</label></th><td><input id="in8" type="checkbox" /></td></tr>
			<tr><th><label for="in9">Optimized SVG size</label></th><td><input id="in9" type="checkbox" checked /></td></tr>
		</table>

		<div class="download-buttons">
			<button id="btnDownloadPng">Download PNG</button>
		</div>
	</div>

	<div id="txt"><textarea id="msg"></textarea></div>
	<div id="hnt"><pre id="res"></pre></div>

	<script>
		"use strict";
		(function () {
			const box = document.getElementById("box"),
				txt = document.getElementById("msg"),
				res = document.getElementById("res"),
				set = document.getElementById("set"),
				op1 = document.getElementById("op1"),
				op2 = document.getElementById("op2"),
				in1 = document.getElementById("in1"),
				in2 = document.getElementById("in2"),
				in3 = document.getElementById("in3"),
				in4 = document.getElementById("in4"),
				in5 = document.getElementById("in5"),
				in6 = document.getElementById("in6"),
				in7 = document.getElementById("in7"),
				in8 = document.getElementById("in8"),
				in9 = document.getElementById("in9"),
				btnDownloadPng = document.getElementById("btnDownloadPng");

			const current = (o) => (o._value = o.value);
			const updated = (o) => o._value === o.value;
			const clear = (o) => (o.innerHTML = "");

			const hint = (d) => {
				const s = [];
				if (d.dim === 256) delete d.dim;
				if (d.pad === 4) delete d.pad;
				if (d.mtx === -1) delete d.mtx;
				if (d.ecl === "M") delete d.ecl;
				if (d.ecb === 1) delete d.ecb;
				if (d.pal[1] === 0) d.pal.pop();
				if (d.pal[0] === "#000000" && !d.pal[1]) delete d.pal;
				if (d.vrb === 0) delete d.vrb;

				for (const k in d) {
					let v = d[k];
					if (+v === v) v = `  <i class="num">${v}</i>`;
					else if (Array.isArray(v))
						v = `[<i class="clr">"<i>${v.join('</i>"</i>, <i class="clr">"<i>')}</i>"</i>]`;
					else v = ` <i class="txt">"<i>${v}</i>"</i>`;
					s.push(`${s.length ? "," : " "}<b class="key">${k}</b> : ${v}`);
				}

				res.innerHTML = '<b class="obj"><b>QRCode</b>(</b>' + (s.length === 1 ? `<i class="txt">"<i>${d.msg}</i>"</i>` : "{\n\n    " + s.join("\n    ") + "\n\n}") + '<b class="obj">)</b>;\n\n\n\n\n';
			};

			const download = (d) => {
				const replace = (data, map) =>
					data.replace(new RegExp(Object.keys(map).join("|"), "gi"), (m) => map[m]);

				const optimized =
					"<!--\n\nhttps://github.com/muhalvin/qrcode\n\n-->" +
					replace(d, {
						"M ": "M",
						" M ": "M",
						" V ": "V",
						" v ": "v",
						" H ": "H",
						" h ": "h",
						" Z": "Z",
						" z": "z",
						" />": "/>",
						"></path>": "/>",
						'svg xmlns="http://www.w3.org/2000/svg"': "svg",
					});

				const filename =
					"qrcode-" +
					replace(new Date().toISOString().slice(0, 19), {
						":": "",
						"-": "",
						T: "-",
					}) +
					".svg";

				const blob = new Blob([optimized], { type: "image/svg+xml" });

				if (window.navigator.msSaveOrOpenBlob) {
					window.navigator.msSaveOrOpenBlob(blob, filename);
				} else {
					const link = document.createElement("a");
					const url = URL.createObjectURL(blob);
					link.href = url;
					link.download = filename;
					document.body.appendChild(link);
					link.click();
					setTimeout(() => {
						document.body.removeChild(link);
						URL.revokeObjectURL(url);
					}, 0);
				}
				return false;
			};

			// ✅ Convert QR (SVG) to PNG
			const downloadPNG = () => {
				const svg = box.querySelector("svg");
				if (!svg) return;

				const xml = new XMLSerializer().serializeToString(svg);
				const svg64 = btoa(unescape(encodeURIComponent(xml)));
				const image64 = "data:image/svg+xml;base64," + svg64;

				const img = new Image();
				img.onload = function () {
					const canvas = document.createElement("canvas");
					const size = +in1.value || 256;
					canvas.width = size;
					canvas.height = size;

					const ctx = canvas.getContext("2d");
					ctx.fillStyle = in7.value || "#fff";
					ctx.fillRect(0, 0, canvas.width, canvas.height);
					ctx.drawImage(img, 0, 0, size, size);

					const link = document.createElement("a");
					link.download = "qrcode-" + new Date().toISOString().replace(/[:\-T]/g, "").slice(0, 14) + ".png";
					link.href = canvas.toDataURL("image/png");
					link.click();
				};
				img.src = image64;
			};

			btnDownloadPng.onclick = downloadPNG;

			op1.onclick = () => (set.className = "show", false);
			op2.onclick = () => (set.className = "hide", false);

			[in1, in2, in3, in4, in5, in6, in8, in9].forEach((el) => el.onchange = () => box.update());
			in7.onchange = () => { in8.checked = true; box.update(); };

			txt.onkeyup = () => { if (!updated(txt)) { box.update(); current(txt); } };

			box.update = () => {
				clear(box);
				const start = performance.now();
				const data = {
					msg: txt.value,
					dim: in1.value | 0,
					pad: in2.value | 0,
					mtx: in3.value,
					ecl: in4.value,
					ecb: in5.checked | 0,
					pal: [in6.value, in8.checked | 0 && in7.value],
					vrb: in9.checked ? 0 : 1,
				};

				box.appendChild(QRCode(data)).onclick = () => download(box.innerHTML);
				console.log("QRCode generation time:", Math.round(performance.now() - start), "ms");
				hint(data);
			};

			txt.value = [
				"Scan me to visit our website!",
				"Welcome to QR Generator",
				"Paste your link here",
				"Enter your message",
				"Write something to encode",
				"Try typing a URL or text",
				"Your custom QR code message",
				"Type your data here",
				"Share your info via QR",
				"Encode this text!"
			][(Math.random() * 10) | 0];

			current(txt);
			box.update();
			txt.focus();
		})();
	</script>
</body>

</html>
